name: staphit2 images

# Builds docker/<image> and pushes ghcr.io/alarawms/<image>:<VERSION> (docker/<image>/VERSION)
# for every image below. Uses the built-in GITHUB_TOKEN; no registry secrets needed.
# A new package is private on first push: make it public once (GitHub > Packages > settings).
on:
  push:
    branches: [main]
    paths: ["docker/staphit2-*/**", ".github/workflows/staphit2-images.yml"]
  pull_request:
    paths: ["docker/staphit2-*/**", ".github/workflows/staphit2-images.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: staphit2-python
            smoke: python -c "import matplotlib, pandas, seaborn, yaml, Bio, openpyxl, pdfplumber, requests, oauthlib, toytree, toyplot"
          - image: staphit2-r
            smoke: Rscript -e 'for (p in c("ape","dplyr","ggnewscale","ggplot2","RColorBrewer","stringr","tidyr","treeio","ggtree","ggtreeExtra")) library(p, character.only = TRUE)'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(cat docker/${{ matrix.image }}/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          load: true
          tags: ${{ matrix.image }}:test

      - name: Smoke test
        run: docker run --rm ${{ matrix.image }}:test ${{ matrix.smoke }}

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          push: true
          tags: ghcr.io/alarawms/${{ matrix.image }}:${{ steps.v.outputs.version }}
