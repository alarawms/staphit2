name: "amrfinderplus"
description: Identify antimicrobial resistance genes using NCBI AMRFinderPlus with Staphylococcus aureus organism-specific options
keywords:
  - antimicrobial resistance
  - amrfinderplus
  - amr
  - ncbi
tools:
  - amrfinderplus:
      description: NCBI tool for identifying AMR genes, resistance-associated point mutations, and virulence factors
      homepage: https://github.com/ncbi/amr
      documentation: https://github.com/ncbi/amr/wiki
      licence: ["Public Domain"]
input:
  - name: meta
    type: map
    description: Groovy Map containing sample information (id)
  - name: assembly
    type: file
    description: Genome assembly FASTA file
    pattern: "*.fasta"
output:
  - name: report
    type: file
    description: AMRFinderPlus results TSV
    pattern: "*_amrfinder.tsv"
authors:
  - "@alarawms"
