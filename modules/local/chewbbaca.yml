name: "chewbbaca"
description: cgMLST with the PubMLST S. aureus scheme (CGMLST_SCHEMA download, CHEWBBACA_PREP, one CHEWBBACA_ALLELE run for all samples, CGMLST_DISTS allele distances)
keywords:
  - cgmlst
  - allele calling
  - chewbbaca
  - molecular typing
  - genomic epidemiology
tools:
  - chewbbaca:
      description: Comprehensive pipeline for cgMLST/wgMLST schema creation and allele calling
      homepage: https://github.com/B-UMMI/chewBBACA
      documentation: https://chewbbaca.readthedocs.io
      licence: ["GPL-3.0"]
input:
  - name: schema_fasta_dir
    type: directory
    description: One allele FASTA per locus from PubMLST (CHEWBBACA_PREP input)
    pattern: "schema_fasta"
  - name: ids
    type: list
    description: Sample IDs, in the same order as the assemblies (CHEWBBACA_ALLELE input)
  - name: assemblies
    type: file
    description: Genome assemblies of all samples, plain or gzipped FASTA (CHEWBBACA_ALLELE input)
    pattern: "*.{fasta,fa,fa.gz}"
  - name: schema
    type: directory
    description: Prepared chewBBACA schema (CHEWBBACA_ALLELE input)
    pattern: "prepared_schema"
  - name: profiles
    type: file
    description: chewBBACA allele matrix (CGMLST_DISTS input)
    pattern: "results_alleles.tsv"
output:
  - name: fasta
    type: directory
    description: Downloaded scheme, one FASTA per locus (CGMLST_SCHEMA output)
    pattern: "schema_fasta"
  - name: schema
    type: directory
    description: Prepared chewBBACA schema (CHEWBBACA_PREP output)
    pattern: "prepared_schema"
  - name: profiles
    type: file
    description: Allele call per sample and locus (CHEWBBACA_ALLELE output)
    pattern: "results_alleles.tsv"
  - name: stats
    type: file
    description: chewBBACA classification counts per sample (CHEWBBACA_ALLELE) or loci called/missing per sample (CGMLST_DISTS)
    pattern: "{results_statistics,cgmlst_stats}.tsv"
  - name: dists
    type: file
    description: Pairwise allele differences (CGMLST_DISTS output)
    pattern: "cgmlst_distances.tsv"
authors:
  - "@alarawms"
