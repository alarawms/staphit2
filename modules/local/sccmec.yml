name: "sccmec"
description: Determine SCCmec cassette type and mecA presence from genome assembly
keywords:
  - sccmec
  - methicillin resistance
  - staphylococcus aureus
  - molecular typing
tools:
  - sccmec_typer:
      description: SCCmec cassette typing tool for Staphylococcus aureus
      homepage: https://github.com/alarawms/sccmec_typer
      documentation: https://github.com/alarawms/sccmec_typer
      licence: ["MIT"]
input:
  - name: meta
    type: map
    description: Groovy Map containing sample information (id)
  - name: assembly
    type: file
    description: Genome assembly FASTA file
    pattern: "*.fasta"
output:
  - name: report
    type: file
    description: SCCmec typing results TSV (includes Estimated_Type and Estimation_Score for partial/fragmented assemblies)
    pattern: "*_sccmec.tsv"
  - name: json
    type: file
    description: Full classification with confidence scores, estimation, and gene locations
    pattern: "*_sccmec.json"
  - name: elements
    type: file
    description: Per-gene alignment details (coordinates, identity, coverage)
    pattern: "*_sccmec_elements.csv"
  - name: svg
    type: file
    description: IWG-SCC color-coded SCCmec cassette diagram
    pattern: "*_sccmec_map.svg"
  - name: html
    type: file
    description: Interactive HTML report with diagrams and confidence scores
    pattern: "*_sccmec_report.html"
authors:
  - "@alarawms"
