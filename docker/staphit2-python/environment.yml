# Python environment for staphit2's own scripts (bin/). Used for the container
# (docker/staphit2-python/Dockerfile -> ghcr.io/alarawms/staphit2-python) and the conda profile.
name: staphit2-python
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12
  - conda-forge::matplotlib=3.9.2
  - conda-forge::pandas=2.2.3
  - conda-forge::seaborn=0.13.2
  - conda-forge::pyyaml=6.0.2
  - conda-forge::biopython=1.84
  - conda-forge::openpyxl=3.1.5
  - conda-forge::pdfplumber=0.11.4
  - conda-forge::requests=2.32.3
  - conda-forge::oauthlib=3.2.2
  - conda-forge::toytree=3.0.10
  - conda-forge::toyplot=2.0.0
  - conda-forge::procps-ng=4.0.4
