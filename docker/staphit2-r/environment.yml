# R environment for bin/plot_tree.R (PLOT_TREE). Bump VERSION when changing pins.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - r-ape=5.8_1
  - r-dplyr=1.2.1
  - r-ggnewscale=0.5.2
  - r-ggplot2=4.0.3
  - r-rcolorbrewer=1.1_3
  - r-stringr=1.6.0
  - r-tidyr=1.3.2
  - bioconductor-treeio=1.34.0
  - bioconductor-ggtree=4.0.5
  - bioconductor-ggtreeextra=1.20.1
  - procps-ng=4.0.6
